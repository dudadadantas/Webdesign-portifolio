    <form oninput="resultadonota.value=notaestilo.value">
       <p>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome"placehoder="Ex.deolane">
       </p> 
       <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="ex.@dominio.com">
       </p>
       <p>
        <label for="data-nascimento">Data de nascimento:</label>
        <input type="date" id="data-nascimento" name="data-nascimento">
       </p>
       <p>
        <label>quais esportes e lazer você pratica? >(Marcar quantos quiser)</label> <br>
        <input type="checkbox"id="esp1" name="esportes" value="futebol">
    <label for="esp1">Futebol de várzea/Quadra</label><br>
    <input type="checkbox" id="esp2" name="esportes" value="basquete">
    <label for="esp2">Basquete</label><br>

    <label for="esp3">Natação</label><br>

      </p>
      <p>
        <label for="marca">Qual marca de roupa ou tênis que você prefere?</label> <br><br>
        <input list="marcas" id="marca" name="marca" placeholder="Ex. Nike, Adidas, Puma">
        <datalist id="marcas">
            <option value="nike">Nike</option>
            <option value="adidas">Adidas</option><br>

        </datalist>
      </p>
        <p>
            <label for="instituicao">onde você foca os seus estudos atualmente?</label>
            <select id="instituicao" name="instituicao">
          <optgroup label="ensino tecnico regular">
            <option value="escola-estadual">escola publica</option>
            <option value="escola-particular">escola particular</option>
          </optgroup>optgrroup projeto e ensino superior>

        </p>
